name: Run Proxygen tests
description: >-
  Gets a pytest-nhsd-apim token with the Proxygen CLI, removes the CLI's credentials, then runs
  tests/proxygen against a deployed instance and uploads the JUnit report. Needs the
  proxygen-setup action and `poetry install` to have run first.

inputs:
  environment:
    description: Proxygen environment, e.g. internal-dev, int or prod
    required: true
  base-path:
    description: Instance base path, with '_' for '/'
    required: true
  include-paths:
    description: Whether the instance was deployed with the API's paths
    required: false
    default: 'true'
  require-token:
    description: Fail rather than skip the token tests if no pytest-nhsd-apim token can be got
    required: false
    default: 'false'
  status-endpoint-api-key:
    description: Key for /_status. Required outside internal-dev, internal-qa and ref
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Get pytest-nhsd-apim token
      shell: bash
      run: |
        if ! output=$(proxygen pytest-nhsd-apim get-token 2>&1); then
          echo "::warning::Couldn't get a pytest-nhsd-apim token, so tests that need one will be skipped"
          echo "$output" | tail -n 5
          exit 0
        fi
        token=$(echo "$output" | jq -r .pytest_nhsd_apim_token)
        echo "::add-mask::$token"
        echo "APIGEE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

    # The tests don't need the CLI, so its credentials aren't left around while they run.
    - name: Remove Proxygen credentials
      shell: bash
      run: rm -rf ~/.proxygen

    - name: Run tests
      shell: bash
      env:
        PROXYGEN_ENV: ${{ inputs.environment }}
        PROXYGEN_BASE_PATH: ${{ inputs.base-path }}
        PROXYGEN_INCLUDE_PATHS: ${{ inputs.include-paths }}
        PROXYGEN_REQUIRE_APIGEE_TOKEN: ${{ inputs.require-token }}
        STATUS_ENDPOINT_API_KEY: ${{ inputs.status-endpoint-api-key }}
      run: make proxygen-test

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: proxygen-${{ inputs.environment }}-test-report
        path: proxygen-test-report.xml
        if-no-files-found: ignore
