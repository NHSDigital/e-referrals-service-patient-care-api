[pytest]
python_files = *_tests.py test_*.py
norecursedirs = .venv .eggs build dist utils
addopts = --strict-markers
markers =
    e2e: end to end tests
    smoketest: suitable to run against all environments even production
    contract_test: run against the echo target of APIM
    proxygen: run against an instance deployed by Proxygen (tests/proxygen)
    apigee_token: needs APIGEE_ACCESS_TOKEN for pytest-nhsd-apim, skipped without it
    api_paths: needs the instance deployed with its API paths, skipped when PROXYGEN_INCLUDE_PATHS=false
