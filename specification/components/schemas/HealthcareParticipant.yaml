title: HealthcareParticipant
type: object
required:
  - actor
  - status
properties:
  actor:
    type: object
    required:
    - identifier
    properties:
      identifier:
        $ref: identifiers/HealthcareService.yaml
  status:
    type: string
    enum:
      - accepted
    example: 'accepted'
  display:
    description: To display the service name
    type: string
    example: 'General clinic - Cardiology - BTL NHS TRUST R69'
